    <!-- ================== JSON-LD (b) FAQPage ==================
         Espelha exatamente o bloco #faq visivel da pagina.
         Editar um exige editar o outro. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "@id": "https://lienreabilitacaooral.com.br/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Quanto tempo dura um implante dentário?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Um implante bem planejado e mantido pode durar décadas. A longevidade depende da qualidade óssea, da higiene diária e das consultas de acompanhamento. Na Lien, cada implante entra em um protocolo de monitoramento contínuo para preservar o resultado ao longo do tempo."
            }
          },
          {
            "@type": "Question",
            "name": "O procedimento de implante dói?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A cirurgia é feita sob anestesia local e o paciente não sente dor durante o procedimento. O desconforto no pós-operatório é controlado com medicação e costuma ser menor do que a maioria espera. Todo o processo é comunicado antes, passo a passo."
            }
          },
          {
            "@type": "Question",
            "name": "Quem tem diabetes ou osteoporose pode fazer implante?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Em muitos casos, sim. Diabetes controlada e osteoporose não são impedimentos automáticos, mas exigem avaliação criteriosa e integração com seu médico. O diagnóstico profundo da Lien existe justamente para definir a conduta segura em cada situação."
            }
          },
          {
            "@type": "Question",
            "name": "Qual a diferença entre prótese e implante?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O implante é um pino de titânio fixado no osso que substitui a raiz do dente. A prótese é a parte visível, que devolve forma e função. Uma prótese pode ser sustentada por implantes, por dentes naturais ou ser removível — a escolha depende do seu caso."
            }
          },
          {
            "@type": "Question",
            "name": "Em quanto tempo fico com o dente definitivo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Depende do caso. Há situações de carga imediata, com dente provisório no mesmo dia da cirurgia. Em outras, aguarda-se a integração do implante ao osso antes da peça definitiva. O prazo real é definido no planejamento digital, antes de começar."
            }
          },
          {
            "@type": "Question",
            "name": "A Lien atende pacientes com medo de dentista?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sim — é o foco central da clínica. Boa parte dos nossos pacientes evitou o dentista por anos. A recepção, a aromaterapia, a música e a comunicação constante durante o procedimento existem para que você saiba o que vai acontecer antes de acontecer."
            }
          },
          {
            "@type": "Question",
            "name": "A Lien atende convênio?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Consulte as condições de atendimento diretamente pelo WhatsApp. [[CONFIRMAR]]"
            }
          },
          {
            "@type": "Question",
            "name": "Onde fica a clínica e como chegar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A Lien fica no Edifício Asteca, na Av. do Contorno, 5351 — bairro Cruzeiro, Belo Horizonte (MG). O atendimento é de segunda a sexta, das 8h às 19h. Pelo WhatsApp orientamos sobre acesso e estacionamento."
            }
          }
        ]
      }
    </script>
